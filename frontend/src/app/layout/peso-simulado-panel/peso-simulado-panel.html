@if (visible()) {
  <div class="peso-simulado-panel">
    <div class="peso-simulado-panel__label">Simulador de peso (dev)</div>

    <input
      class="peso-simulado-panel__input"
      type="number"
      placeholder="Peso"
      [value]="pesoInput() ?? ''"
      (input)="onInputChange($event)"
    />

    <div class="peso-simulado-panel__botones">
      <button type="button" (click)="enviar('Bascula')">Enviar como Báscula</button>
      <button type="button" (click)="enviar('Manual')">Enviar como Manual</button>
    </div>

    <div class="peso-simulado-panel__lectura">
      Lectura actual: {{ lectura().peso ?? '—' }} ({{ lectura().origen ?? 'sin origen' }})
    </div>
  </div>
}
