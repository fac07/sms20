services:
  sqlserver:
    # La imagen oficial mcr.microsoft.com/mssql/server NO tiene build nativo
    # para arm64 (Apple Silicon) — corre solo bajo emulación, más lenta y a
    # veces inestable. Azure SQL Edge sí es nativo arm64 y suficientemente
    # compatible con T-SQL/EF Core para desarrollo local. No es 100% idéntico
    # al SQL Server real que va a dar IT — para paridad exacta, cambiar la
    # imagen de abajo por mcr.microsoft.com/mssql/server:2022-latest
    # (funciona en Mac Intel sin cambios, y en Apple Silicon vía emulación).
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: sms20-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Sms20-Dev!2026"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sqlserver-data:
